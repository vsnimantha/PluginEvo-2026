[PATHS]
gcc_plugin_path = /instrument-attribute/instrument-attribute-gcc-plugin-main
plugin_output_path = /instrument-attribute/instrument-attribute-gcc-plugin-main/
plugin_output_name = compiled_plugin.so
generated_program_save_path= Generated_Programs
main_report_path = Reports
gcov_json_output_path=Gcov_Report/Json_Output
gcovr_html_report_path=Gcovr_Report/Html_Report
gcovr_json_report_path=Gcovr_Report/Json_Report
gcovr_jacoco_xml_report_path=Gcovr_Report/Jacoco_XML_Report
gcovr_summary_report_path=Gcovr_Report/Summary
specific_plugin_headers_inclue_path=pluginHeaders_armNoneEabiGcc7

[COVERAGE_ANALYSER]
compile_plugin_always=True
clear_gcov_data=True
clean_gcov_report_directory=True
clean_generated_program_directory=False
print_gcovr_data_to_console=True
generate_gcovr_html_report=False
generate_gcovr_json_report=False
generate_gcovr_jacoco_xml_report=False
generate_gcov_data=False
source_extensions= ['.c', '.cc', '.cpp']
format_json_output=True
prompt_test_program_when_request_fails=True
offline_mode=True
use_plugin_specific_additional_includes=True
use_specific_plugin_headers=False
use_specific_plugin_arguments=True
use_additional_plugin_compiler_flags=True
gcov_version=gcov-10
use_additional_program_compiler_flags=True

[PLUGIN_COMPILATION_GCC_CONFIGURATION]
gcc_version=gcc-10
cxx_version=g++-10
use_condition_coverage=True

[ADDITIONAL_PLUGIN_COMPILER_FLAGS]
flag_1=-fpermissive
flag_2=-w
flag_3=-Wall
flag_4=-O0

[PLUGIN_SPECIFIC_ADDITIONAL_INCLUDES]
include_1 = include

[PLUGIN_SPECIFIC_ARUGMENTS]
include-file-list=log
debug=



[PLUGIN_FOLDER_EXCLUDES]
exclude_1=test

[PROGRAM_COMPILATION_GCC_CONFIGURATION]
gcc_version=gcc-10
cxx_version=g++-10

[PROGRAM_COMPILATION_ADDITIONAL_FLAGS_CONFIGURATION]
flag_1=-finstrument-functions


[GCOVR_CONFIGURATION]
gcov_version=gcov-10
verbose=False

[GENERAL]
debug_mode = True

[FEEDBACK_MANAGER]
server_host = 0.0.0.0
server_port = 5001
generate_url= http://localhost:5002/generate_programs
generate_url_gp= http://localhost:5002/generate_programs_for_gp
destination_url = http://localhost:5002/report

